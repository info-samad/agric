name: نشر المنصة على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: بناء المحتوى الثابت
        run: python3 scripts/build_site.py
      - name: فحص الروابط والملفات المحلية والحسابات
        run: |
          python3 scripts/check_site.py
          node scripts/test_calculators.cjs
          node scripts/test_schedule_tabs.cjs
          for file in public/assets/js/*.js; do node --check "$file"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: نشر
        id: deployment
        uses: actions/deploy-pages@v4
